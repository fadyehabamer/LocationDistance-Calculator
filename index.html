<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Distance Calculator</title>
    <meta name="description" content="Calculate driving distance and travel time between two locations on an interactive Mapbox map.">
    <meta name="theme-color" content="#ffffff">

    <link href='https://api.mapbox.com/mapbox-gl-js/v2.10.0/mapbox-gl.css' rel='stylesheet' />
    <link rel='stylesheet' href='https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.1.0/mapbox-gl-directions.css' type='text/css' />
    <link rel="stylesheet" href="style.css"> 
    

</head>

<body>
    <main>
        <h1 class="visually-hidden">Trip Distance Calculator</h1>
        <div id='map' role="region" aria-label="Interactive map with driving directions"></div>
        <section class="trip-panel" aria-labelledby="trip-title">
            <div class="trip-header">
                <h2 id="trip-title">Trip summary</h2>
                <div class="unit-toggle" role="group" aria-label="Distance unit">
                    <button type="button" data-unit="km" aria-pressed="true">km</button>
                    <button type="button" data-unit="mi" aria-pressed="false">mi</button>
                </div>
            </div>
            <dl class="trip-stats" aria-live="polite">
                <div>
                    <dt>Distance</dt>
                    <dd id="trip-distance">&ndash;</dd>
                </div>
                <div>
                    <dt>Travel time<span id="trip-mode"></span></dt>
                    <dd id="trip-duration">&ndash;</dd>
                </div>
            </dl>
            <p class="trip-hint" id="trip-hint">Choose a starting place and a destination in the directions panel.</p>
        </section>
        <noscript>This app needs JavaScript enabled to display the map and calculate distances.</noscript>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.10.0/mapbox-gl.js'></script>
    <script src="main.js" type="module"></script>

    <!-- MapboxDirections -->
    <script src='https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.1.0/mapbox-gl-directions.js'></script>

</body>

</html>
